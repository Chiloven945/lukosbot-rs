[advisories]
version = 2
yanked = "warn"
ignore = [
    # teloxide -> aquamarine -> proc-macro-error2. This is a compile-time-only proc macro;
    # the crate is unmaintained but no runtime component is linked into the application.
    { id = "RUSTSEC-2026-0173", reason = "compile-time proc macro with no safe upgrade and no runtime exposure" },
]

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
