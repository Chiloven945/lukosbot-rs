# Example configuration. Copy to `config/application.toml` and adjust.
# Secrets should be supplied through environment variables, not this file.

[app]
environment = "development"
shutdown_timeout_secs = 15

[logging]
format = "pretty" # pretty | compact | json
filter = "info,sqlx=warn"

[runtime]
inbound_queue_capacity = 256
outbound_queue_capacity = 128
handler_timeout_secs = 30
send_timeout_secs = 20

[http]
connect_timeout_secs = 5
request_timeout_secs = 20
max_response_bytes = 10485760
user_agent = "LukosBot/0.1 (+https://github.com/Chiloven945/lukosbot-rs)"
proxy = "" # e.g. "http://127.0.0.1:8000" or "socks5h://127.0.0.1:1080"

[storage]
sqlite_path = "./data/lukosbot.sqlite3"
busy_timeout_ms = 5000
max_connections = 5
create_parent_dirs = true
expiry_cleanup_interval_secs = 3600

[platforms.telegram]
enabled = false
token = ""

[platforms.discord]
enabled = false
token = ""

[security.bootstrap_bot_admins]
telegram = []
discord = []

[[policy.rules]]
id = "example-telegram-public-ratings"
priority = 100
disable_commands = ["kemono"]

[policy.rules.when]
platform = "telegram"
private_chat = false

[policy.rules.allow_values]
"[e621.rating]" = ["s", "q"]

[commands]
prefix = "/"

[commands.control]
admin = true
pref = true
service = true

[commands.basic]
ping = true
echo = true
coin = true
dice = true
luck = true
twenty_four = true
weather = true

[commands.twenty_four]
time_limit_secs = 300

[commands.integrations]
github = true
bilibili = true
ip = true
music = true
whois = true

[integrations.github]
# Optional. Empty means anonymous access; rate limits are lower.
token = ""

[integrations.music.spotify]
enabled = false
client_id = ""
client_secret = ""

[integrations.music.soundcloud]
enabled = false
client_id = ""

[integrations.whois]
connect_timeout_secs = 3
total_timeout_secs = 8
max_response_bytes = 65536
