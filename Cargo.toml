[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/core",
    "crates/integrations",
    "crates/infra",
    "crates/platform-telegram",
    "crates/platform-discord",
    "crates/command-engine",
    "crates/commands",
    "crates/app",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/Chiloven945/lukosbot-rs"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[workspace.dependencies]
# Internal crates
lukosbot-domain = { version = "0.1.0", path = "crates/domain" }
lukosbot-core = { version = "0.1.0", path = "crates/core" }
lukosbot-integrations = { version = "0.1.0", path = "crates/integrations" }
lukosbot-infra = { version = "0.1.0", path = "crates/infra" }
lukosbot-platform-telegram = { version = "0.1.0", path = "crates/platform-telegram" }
lukosbot-platform-discord = { version = "0.1.0", path = "crates/platform-discord" }
lukosbot-command-engine = { version = "0.1.0", path = "crates/command-engine" }
lukosbot-commands = { version = "0.1.0", path = "crates/commands" }

# Shared third-party dependencies
anyhow = "1"
async-trait = "0.1"
base64 = "0.23.1"
bytes = "1"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
config = { version = "0.15", features = ["toml"] }
dotenvy = "0.15"
fastrand = "2"
htmd = "0.5"
idna = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
scraper = "0.29"
thirtyfour = { version = "0.38", default-features = false, features = ["reqwest", "rustls"] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "http2",
    "json",
    "charset",
    "socks",
] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "model",
    "http",
    "builder",
    "cache",
    "native_tls_backend",
] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
teloxide = { version = "0.17", default-features = false, features = ["rustls"] }
thiserror = "2"
tokio = { version = "1.54", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "net",
    "io-util",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"

# Test dependencies
tempfile = "3"
wiremock = "0.6"
