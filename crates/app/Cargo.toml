[package]
name = "lukosbot-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["telegram", "discord"]
telegram = ["dep:lukosbot-platform-telegram"]
discord = ["dep:lukosbot-platform-discord"]

[lib]
name = "lukosbot_app"
path = "src/lib.rs"

[[bin]]
name = "lukosbot"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
config.workspace = true
dotenvy.workspace = true
lukosbot-core.workspace = true
lukosbot-infra.workspace = true
lukosbot-platform-discord = { workspace = true, optional = true }
lukosbot-platform-telegram = { workspace = true, optional = true }
secrecy.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
